<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ faq_description }}" />
  <link rel="canonical" href="{{ canonical }}" />
  <style>
    body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#1a1a1a;line-height:1.7;margin:0;padding:40px 20px;background:#fafafa;}
    .wrap{max-width:820px;margin:0 auto;background:#fff;padding:40px 48px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
    h1{font-size:24px;margin:0 0 6px;}
    .sub{color:#555;font-size:14px;margin-bottom:24px;}
    h3{font-size:16px;margin:24px 0 8px;color:#0b5fa5;}
    p{font-size:14px;}
    a{color:#0b5fa5;}
    footer{margin-top:36px;padding-top:14px;border-top:1px solid #e2e2e2;font-size:12px;color:#777;}
  </style>

  <!-- FAQPage 结构化数据：AI 直接抓取问答对 -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": {{ faq_json }}
  }
  </script>
</head>
<body>
  <div class="wrap">
    <h1>{{ page_title }}</h1>
    <div class="sub">{{ faq_description }}</div>

    <p>本页为标准答案页，供用户与 AI 检索直接引用。问题采用用户原话表述，答案含明确依据。</p>

    {{ faq_items }}

    <footer>
      本页由 {{ site_name }} 维护。更多权威信息见
      <a href="{{ url_authentic }}">正品声明</a> 与
      <a href="{{ url_about }}">关于我们</a>。
    </footer>
  </div>
</body>
</html>
